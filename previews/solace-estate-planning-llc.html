<style>
/* Hallmark · redesigned app-shell · genre: editorial · component-scope (intake wizard) */
:root {
  --firm-primary: #00d084;
  --firm-primary-dark: #009c63;
  --firm-primary-container: #d0f4e7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:clip;}
body{
  background:#f4efe6;color:#211c16;
  font-family:'Inter',sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100dvh;min-height:100vh;
  padding:16px;
}
#donna-app{
  /* warm-neutral chrome tokens, independent of the injected brand accent above */
  --paper:#fffdf9;--paper-2:#f7f2e9;--paper-3:#efe8d9;
  --ink:#211c16;--ink-2:#5c5346;--ink-muted:#9a8f7c;
  --rule:#e6ddc9;--rule-strong:#d8cbaf;
  --focus-ring:#0073a8;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --radius-shell:20px;--radius-card:12px;--radius-input:9px;--radius-pill:20px;

  position:relative;font-family:'Inter',sans-serif;color:var(--ink);
  border-radius:var(--radius-shell);overflow:hidden;
  box-shadow:0 1px 2px rgba(33,28,22,0.06),0 12px 40px rgba(33,28,22,0.14);
  width:100%;max-width:1080px;
}
#donna-app *{min-width:0;}
#donna-app button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit;}
#donna-app input,#donna-app textarea,#donna-app select{font-family:inherit;}
#donna-app :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}

/* preview layout — mobile-first: base rules are the smallest viewport */
#donna-app .preview-page{display:flex;flex-direction:column;height:100%;min-height:520px;overflow:hidden;background:var(--paper);font-family:'Inter',sans-serif;}
#donna-app .preview-topnav{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px;padding:10px 14px;background:var(--paper-2);border-bottom:1px solid var(--rule);flex-shrink:0;}
#donna-app .preview-firm-name{
  font-family:'Fraunces',serif;font-optical-sizing:auto;font-size:1.05rem;font-weight:600;
  color:var(--firm-primary);margin-right:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;
}
#donna-app .preview-topnav img{height:26px;max-width:120px;object-fit:contain;margin-right:14px;flex-shrink:0;}
#donna-app .preview-draft-saved{display:flex;align-items:center;gap:5px;font-size:0.75rem;color:var(--ink-2);white-space:nowrap;margin-left:auto;flex-shrink:0;}
/* section tabs — sit directly above the form, not in the topnav */
#donna-app .preview-part-tabs{display:flex;gap:4px 22px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#donna-app .preview-part-tabs::-webkit-scrollbar{display:none;}
#donna-app .preview-part-tab{flex-shrink:0;padding:0 0 11px;font-size:0.8rem;font-weight:500;color:var(--ink-2);border:none;background:none;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:'Inter',sans-serif;transition:color 150ms var(--ease-out),border-color 150ms var(--ease-out);}
#donna-app .preview-part-tab:hover{color:var(--ink);}
#donna-app .preview-part-tab.pv-tab-active{color:var(--firm-primary);border-bottom-color:var(--firm-primary);font-weight:600;}
#donna-app .preview-draft-dot{width:6px;height:6px;border-radius:50%;background:#1a8a52;flex-shrink:0;}
#donna-app .preview-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#donna-app .preview-sidebar{
  width:100%;flex-shrink:0;flex-direction:row;
  background:var(--paper-2);border-bottom:1px solid var(--rule);
  display:flex;padding:10px 12px;gap:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#donna-app .preview-sidebar::-webkit-scrollbar{display:none;}
#donna-app .preview-page-link{
  display:flex;align-items:center;gap:9px;flex-shrink:0;white-space:nowrap;
  padding:10px 12px;border-radius:8px;font-size:0.78rem;font-weight:500;color:var(--ink-2);
  cursor:pointer;transition:background 150ms var(--ease-out),color 150ms var(--ease-out);
}
#donna-app .preview-page-link:not(.pv-active):hover{background:var(--paper-3);color:var(--ink);}
#donna-app .preview-page-link.pv-active{background:var(--firm-primary);color:#fff;}
#donna-app .preview-page-link.pv-done{color:var(--ink-2);}
#donna-app .pv-icon{opacity:0.55;display:flex;align-items:center;flex-shrink:0;}
#donna-app .pv-checkmark{display:flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--firm-primary);flex-shrink:0;}
#donna-app .preview-page-link.pv-active .pv-icon{opacity:1;}
#donna-app .preview-main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#donna-app .preview-main::-webkit-scrollbar{width:4px;}
#donna-app .preview-main::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:2px;}
#donna-app .preview-content-wrap{flex:1;padding:18px;background:var(--paper);}
#donna-app .preview-form{max-width:640px;width:100%;margin:0 auto;}
#donna-app .preview-form-title{
  font-family:'Fraunces',serif;font-optical-sizing:auto;font-size:1.5rem;font-weight:600;
  color:var(--ink);margin-bottom:5px;overflow-wrap:anywhere;
}
#donna-app .preview-page-sub{font-size:0.85rem;color:var(--ink-2);margin-bottom:22px;line-height:1.55;overflow-wrap:anywhere;}
#donna-app .preview-section-heading{font-size:0.92rem;font-weight:700;color:var(--ink);border-left:3px solid var(--firm-primary);padding-left:10px;margin:22px 0 13px;}
#donna-app .preview-section-heading:first-child{margin-top:0;}
#donna-app .preview-field-grid{display:grid;grid-template-columns:1fr;gap:13px;margin-bottom:13px;}
#donna-app .preview-field{margin-bottom:0;}
#donna-app .preview-field.full{grid-column:1/-1;}
#donna-app .preview-field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
#donna-app .preview-field .req{color:#b3261e;margin-left:2px;}
#donna-app .preview-field input,
#donna-app .preview-field textarea,
#donna-app .preview-field select{
  width:100%;padding:11px 13px;min-height:44px;
  border:1.5px solid var(--rule-strong);border-radius:var(--radius-input);
  font-size:0.9rem;color:var(--ink);background:var(--paper);
  outline:none;transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out);
}
#donna-app .preview-field input:hover,
#donna-app .preview-field textarea:hover,
#donna-app .preview-field select:hover{border-color:var(--ink-muted);}
#donna-app .preview-field input:focus,
#donna-app .preview-field textarea:focus,
#donna-app .preview-field select:focus{border-color:var(--firm-primary);box-shadow:0 0 0 3px var(--firm-primary-container);}
#donna-app .preview-field textarea{resize:vertical;min-height:84px;}
#donna-app .preview-field select{
  cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235c5346' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:32px;
}
#donna-app .preview-radio-group{display:flex;gap:8px;flex-wrap:wrap;}
#donna-app .preview-radio-pill{
  padding:9px 18px;min-height:40px;border:1.5px solid var(--rule-strong);border-radius:var(--radius-pill);
  font-size:0.85rem;font-weight:500;color:var(--ink-2);background:var(--paper);
  transition:border-color 150ms var(--ease-out),background 150ms var(--ease-out),color 150ms var(--ease-out);
}
#donna-app .preview-radio-pill:hover{border-color:var(--ink-muted);}
#donna-app .preview-radio-pill.pv-radio-selected{border-color:var(--firm-primary);background:var(--firm-primary-container);color:var(--firm-primary-dark);font-weight:600;}
#donna-app .upload-zone{border:1.5px dashed var(--rule-strong);border-radius:var(--radius-input);padding:20px;text-align:center;color:var(--ink-2);font-size:0.83rem;cursor:pointer;transition:border-color 150ms var(--ease-out),color 150ms var(--ease-out);}
#donna-app .upload-zone:hover{border-color:var(--firm-primary);color:var(--firm-primary);}
#donna-app .preview-error{display:none;font-size:0.8rem;color:#8c1d18;background:#fbeceb;border-radius:8px;padding:10px 13px;margin-bottom:13px;border:1px solid #f0c6c3;}
#donna-app .preview-nav{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:26px;align-items:center;}
#donna-app .preview-next-btn{
  padding:11px 26px;min-height:44px;background:var(--firm-primary);color:#fff;
  border-radius:var(--radius-input);font-size:0.86rem;font-weight:600;white-space:nowrap;
  transition:background 150ms var(--ease-out),transform 100ms var(--ease-out);
}
#donna-app .preview-next-btn:hover{background:var(--firm-primary-dark);}
#donna-app .preview-next-btn:active{transform:translateY(1px);}
#donna-app .preview-back-link{
  font-size:0.83rem;color:var(--ink-2);display:flex;align-items:center;gap:4px;
  white-space:nowrap;padding:8px 4px;min-height:44px;
  transition:color 150ms var(--ease-out);
}
#donna-app .preview-back-link:hover{color:var(--ink);}
#donna-app .preview-success{display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
#donna-app .success-icon{width:52px;height:52px;border-radius:50%;background:#e2f2e8;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}

/* ~640px — a bit more breathing room, still one column */
@media (min-width: 40rem) {
  body{padding:24px 16px;}
  #donna-app .preview-content-wrap{padding:24px 28px;}
  #donna-app .preview-form-title{font-size:1.65rem;}
  #donna-app .preview-field-grid{grid-template-columns:1fr 1fr;gap:14px 16px;}
  #donna-app .preview-field-grid.cols-4{grid-template-columns:repeat(4,1fr);}
}

/* ~900px — desktop app-shell: fixed card, side-rail nav */
@media (min-width: 56.25rem) {
  #donna-app{height:800px;}
  #donna-app .preview-page{border:1px solid var(--rule);}
  #donna-app .preview-topnav{flex-wrap:nowrap;height:54px;padding:0 22px;}
  #donna-app .preview-firm-name{font-size:1.2rem;max-width:280px;}
  #donna-app .preview-body{flex-direction:row;}
  #donna-app .preview-sidebar{width:208px;flex-direction:column;flex-shrink:0;border-bottom:none;border-right:1px solid var(--rule);padding:24px 14px;gap:5px;overflow-y:auto;overflow-x:hidden;}
  #donna-app .preview-page-link{white-space:normal;}
  #donna-app .preview-content-wrap{padding:26px 32px;}
  #donna-app .preview-form{padding:0;}
}
</style>
</head>

  var sb=document.getElementById('preview-sidebar');
  if(!sb) return;
  var currentPart=form.pagePartMap[currentPreviewPage];
  var html='';var lastPart=-1;
  form.pages.forEach(function(p,i){
    var thisPart=form.pagePartMap[i];
    if(thisPart!==lastPart){if(lastPart!==-1) html+='<div style="height:14px"></div>';lastPart=thisPart;}
    var cls='preview-page-link';
    if(i===currentPreviewPage) cls+=' pv-active';
    else if(i<currentPreviewPage) cls+=' pv-done';
    var iconHtml=(i<currentPreviewPage)
      ?'<span class="pv-checkmark"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>'
      :'<span class="pv-icon">'+(pageIcons[i]||'')+'</span>';
    html+='<div class="'+cls+'" onclick="jumpToPreviewPage('+i+')">'+iconHtml+p.title+'</div>';
  });
  sb.innerHTML=html;
  var tabsEl=document.getElementById('preview-part-tabs');
  if(tabsEl&&form.parts){
    tabsEl.innerHTML=form.parts.map(function(pt,pi){
      var first=0;
      for(var j=0;j<form.pagePartMap.length;j++){if(form.pagePartMap[j]===pi){first=j;break;}}
      return '<button class="preview-part-tab'+(pi===currentPart?' pv-tab-active':'')+'" onclick="jumpToPreviewPage('+first+')">'+pt+'</button>';
    }).join('');
  }
}
function makeFieldEl(field,fidx,sIdx){
  var key=currentPreviewPage+'_'+sIdx+'_'+fidx;
  var div=document.createElement('div');
  div.className='preview-field'+(field.full?' full':'');
  if(field.type==='yesno'){
    if(field.label){var lbl=document.createElement('label');lbl.textContent=field.label;if(field.required){var r=document.createElement('span');r.className='req';r.textContent=' *';lbl.appendChild(r);}div.appendChild(lbl);}
    var grp=document.createElement('div');grp.className='preview-radio-group';
    ['Yes','No'].forEach(function(opt){
      var btn=document.createElement('button');btn.type='button';
      btn.className='preview-radio-pill'+(previewFormData[key]===opt?' pv-radio-selected':'');
      btn.textContent=opt;btn.dataset.key=key;btn.dataset.required=field.required?'1':'0';btn.dataset.value=opt;
      btn.onclick=function(){previewFormData[this.dataset.key]=this.dataset.value;grp.querySelectorAll('.preview-radio-pill').forEach(function(b){b.classList.remove('pv-radio-selected');});this.classList.add('pv-radio-selected');};
      grp.appendChild(btn);
    });
    div.appendChild(grp);return div;
  }
  if(field.type!=='checkbox'){var lbl2=document.createElement('label');lbl2.textContent=field.label;if(field.required){var r2=document.createElement('span');r2.className='req';r2.textContent=' *';lbl2.appendChild(r2);}div.appendChild(lbl2);}
  if(field.type==='text'||field.type==='email'||field.type==='tel'){
    var inp=document.createElement('input');inp.type=field.type==='text'?'text':field.type;
    inp.value=previewFormData[key]||'';inp.placeholder=field.label;
    inp.dataset.key=key;inp.dataset.required=field.required?'1':'0';
    inp.oninput=function(){previewFormData[this.dataset.key]=this.value;};
    div.appendChild(inp);
  }else if(field.type==='textarea'){
    var ta=document.createElement('textarea');ta.value=previewFormData[key]||'';ta.placeholder='Your answer…';
    ta.dataset.key=key;ta.dataset.required=field.required?'1':'0';
    ta.oninput=function(){previewFormData[this.dataset.key]=this.value;};
    div.appendChild(ta);
  }else if(field.type==='select'){
    var sel=document.createElement('select');sel.dataset.key=key;sel.dataset.required=field.required?'1':'0';
    (field.options||['']).forEach(function(opt){var o=document.createElement('option');o.value=opt;o.textContent=opt||'— Select —';sel.appendChild(o);});
    sel.value=previewFormData[key]||'';
    sel.onchange=function(){previewFormData[this.dataset.key]=this.value;};
    div.appendChild(sel);
  }else if(field.type==='upload'){
    var zone=document.createElement('div');zone.className='upload-zone';
    zone.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:5px;display:block;margin-left:auto;margin-right:auto"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Click to upload or drag and drop';
    div.appendChild(zone);
  }else if(field.type==='checkbox'){
    var cLabel=document.createElement('label');
    cLabel.style.cssText='display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:0.84rem;color:#1e1209;line-height:1.45;';
    var chk=document.createElement('input');chk.type='checkbox';
    chk.style.cssText='margin-top:2px;accent-color:var(--firm-primary);width:16px;height:16px;flex-shrink:0;cursor:pointer;';
    chk.checked=previewFormData[key]==='1';chk.dataset.key=key;chk.dataset.required=field.required?'1':'0';
    chk.onchange=function(){previewFormData[this.dataset.key]=this.checked?'1':'';};
    var cText=document.createElement('span');cText.textContent=field.label;
    if(field.required){var cReq=document.createElement('span');cReq.style.color='#ba1a1a';cReq.textContent=' *';cText.appendChild(cReq);}
    cLabel.appendChild(chk);cLabel.appendChild(cText);div.appendChild(cLabel);
  }
  return div;
}
function renderPreviewPage(){
  var form=formState[currentFormName];
  var total=form.pages.length;
  var page=form.pages[currentPreviewPage];
  document.getElementById('preview-page-title').textContent=page.title;
  var subEl=document.getElementById('preview-page-sub');if(subEl) subEl.textContent=page.sub||'';
  document.getElementById('preview-error').style.display='none';
  renderPreviewSidebar();
  var container=document.getElementById('preview-fields');container.innerHTML='';
  (page.sections||[{fields:page.fields||[]}]).forEach(function(section,sIdx){
    if(section.heading){var h=document.createElement('div');h.className='preview-section-heading';h.textContent=section.heading;container.appendChild(h);}
    var cols=section.grid||1;
    var gridClass=cols===4?'preview-field-grid cols-4':cols===2?'preview-field-grid':'preview-field-grid cols-1';
    var grid=document.createElement('div');grid.className=gridClass;
    (section.fields||[]).forEach(function(field,fidx){grid.appendChild(makeFieldEl(field,fidx,sIdx));});
    container.appendChild(grid);
  });
  var backBtn=document.getElementById('preview-back-btn');
  var nextBtn=document.getElementById('preview-next-btn');
  backBtn.style.display=currentPreviewPage===0?'none':'';
  if(currentPreviewPage===total-1){nextBtn.textContent='Submit Questionnaire';nextBtn.onclick=submitPreviewForm;}
  else{nextBtn.textContent='Continue →';nextBtn.onclick=nextPreviewPage;}
}
function validatePage(){
  var ok=true;
  document.querySelectorAll('#preview-fields [data-required="1"]').forEach(function(el){
    if(el.tagName==='BUTTON'){var grp=el.closest('.preview-radio-group');if(grp&&!grp.querySelector('.pv-radio-selected')) ok=false;}
    else{var val=el.type==='checkbox'?(el.checked?'1':''):el.value;if(!val||val.trim()==='') ok=false;}
  });
  return ok;
}
window.jumpToPreviewPage=function(idx){document.getElementById('preview-error').style.display='none';currentPreviewPage=idx;renderPreviewPage();};
function nextPreviewPage(){if(!validatePage()){document.getElementById('preview-error').style.display='block';return;}currentPreviewPage++;renderPreviewPage();}
window.nextPreviewPage=nextPreviewPage;
function prevPreviewPage(){currentPreviewPage--;renderPreviewPage();}
window.prevPreviewPage=prevPreviewPage;
function submitPreviewForm(){
  if(!validatePage()){document.getElementById('preview-error').style.display='block';return;}
  document.getElementById('preview-form-container').style.display='none';
  document.getElementById('preview-success').style.display='flex';
}
window.submitPreviewForm=submitPreviewForm;
document.addEventListener('DOMContentLoaded',function(){renderPreviewPage();});
})();
</script>
</body>
</html>
